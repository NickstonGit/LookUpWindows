name: windows-ci

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        # Source/development compatibility only. No artifact is ever built here:
        # the production build is CPython 3.14 x64 (source-artifact /
        # build-release below), so a failure on another version is a source
        # regression, not a release one.
        python-version: ["3.10", "3.13", "3.14"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install test dependencies
        run: python -m pip install --quiet pytest ruff==0.16.1

      - name: Lint
        run: python -m ruff check src tools tests

      - name: Byte-compile
        run: python -m compileall -q src

      - name: Import smoke test
        run: python -c "import sys; sys.path.insert(0, 'src'); import config, winapi, dwm, winui, trayicon, icon, recovery, restoreguard, app"

      - name: Source build environment (never the release toolchain)
        run: python tools/check_build_env.py --mode dev

      - name: Run tests
        run: python -m pytest -q tests/

      - name: Source import closure
        run: python tools/check_source_imports.py

  source-artifact:
    needs: test
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          # The archive is published as-is, so it must be produced and verified
          # with the same interpreter the release build uses.
          python-version: "3.14"

      - name: Install artifact and build dependencies
        run: python -m pip install --quiet pytest ruff==0.16.1 -r requirements-build.txt

      - name: Source import closure
        run: python tools/check_source_imports.py

      - name: Release build environment
        run: python tools/check_build_env.py --mode release

      - name: Byte-compile and run tests
        run: |
          python -m compileall -q src
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m pytest -q tests/

      - name: Build source archive
        shell: cmd
        run: arch.bat

      - name: Verify source archive structure and tests
        shell: pwsh
        run: |
          $archive = Get-Item "LookUpWindows-src.zip" -ErrorAction Stop
          & .\tools\verify_source_archive.ps1 -ArchivePath $archive.FullName
